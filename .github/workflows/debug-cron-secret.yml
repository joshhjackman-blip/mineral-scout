name: Debug CRON_SECRET fingerprint

# One-off diagnostic. Prints a SHA-256 fingerprint (and byte length) of
# the CRON_SECRET stored in GitHub Actions. The hash reveals no useful
# information about the value itself — but if it doesn't match a local
# `printf %s "$SECRET" | shasum -a 256` against the value you pasted
# into Vercel, we know the two sides have drifted.
#
# GitHub's log masker replaces exact substring matches of registered
# secrets (and a few obvious encodings). A raw SHA-256 hex digest of
# the secret shares no bytes with the secret itself and isn't masked.
#
# Delete this file once the underlying auth issue is resolved.

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hash CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub secret is empty."
            exit 1
          fi
          LEN=$(printf '%s' "$CRON_SECRET" | wc -c | tr -d ' ')
          HASH=$(printf '%s' "$CRON_SECRET" | sha256sum | awk '{print $1}')
          # Also hash a trimmed version so we can spot trailing whitespace/newline pastes.
          TRIMMED=$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')
          TRIMMED_LEN=$(printf '%s' "$TRIMMED" | wc -c | tr -d ' ')
          TRIMMED_HASH=$(printf '%s' "$TRIMMED" | sha256sum | awk '{print $1}')
          echo "GitHub Actions CRON_SECRET fingerprint:"
          echo "  raw    : length=$LEN  sha256=$HASH"
          echo "  trimmed: length=$TRIMMED_LEN  sha256=$TRIMMED_HASH"
          echo ""
          echo "Compare locally against the value you saved into Vercel:"
          echo "  printf %s \"YOUR_SECRET\" | shasum -a 256"
          echo ""
          echo "If the two hashes differ, the two sides are storing different bytes."
          echo "If raw != trimmed, GitHub's copy has surrounding whitespace/newlines."
