name: RRC wells daily (scrape)

# Daily wellbore metadata refresh at 21:00 UTC (= 4 PM CDT / 3 PM CST),
# one hour before the permits scrape so compute sees fresher operator /
# lease / status on <county>_wells.
#
# Same belt-and-suspenders pattern as rrc-permits-daily.yml:
#   1. Curl the Vercel /api/cron/scrape-wells endpoint (RRC allows
#      Vercel IPs; GitHub Actions runners are blocked).
#   2. The Vercel cron in vercel.json should also fire at 21:00 UTC.
#      Idempotent upsert on api_number — either path succeeding is enough.
#
# Scope today: howard + martin (DEFAULT_COUNTIES in the route). Pass
# ?county=... on the URL to override for ad-hoc runs.

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

concurrency:
  group: rrc-wells-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # See notes in rrc-permits-daily.yml on why we don't use
      # `curl --fail` and why the Authorization header is passed via
      # a bash array instead of eval-substituted from a string.
      - name: Scrape Howard wells
        env:
          VERCEL_CRON_URL: ${{ vars.VERCEL_CRON_WELLS_URL || 'https://mineral-map.vercel.app/api/cron/scrape-wells' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          URL="${VERCEL_CRON_URL}?county=howard"
          echo "Hitting $URL"
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET GitHub secret is empty; endpoint will 401."
          fi
          CURL_ARGS=(-sS --max-time 300
            -o /tmp/wells-howard.json
            -w 'HTTP %{http_code} in %{time_total}s\n')
          if [ -n "$CRON_SECRET" ]; then
            CURL_ARGS+=(-H "Authorization: Bearer $CRON_SECRET")
          fi
          HTTP_LINE=$(curl "${CURL_ARGS[@]}" "$URL")
          echo "$HTTP_LINE"
          STATUS=$(printf '%s' "$HTTP_LINE" | awk '{print $2}')
          if command -v jq >/dev/null; then
            jq '.' /tmp/wells-howard.json 2>/dev/null || cat /tmp/wells-howard.json
          else
            cat /tmp/wells-howard.json
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Vercel wells scrape returned HTTP $STATUS for county=howard. If body says 'unauthorized', sync the CRON_SECRET GitHub secret with the Vercel CRON_SECRET env var."
            exit 1
          fi

      - name: Scrape Martin wells
        env:
          VERCEL_CRON_URL: ${{ vars.VERCEL_CRON_WELLS_URL || 'https://mineral-map.vercel.app/api/cron/scrape-wells' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          URL="${VERCEL_CRON_URL}?county=martin"
          echo "Hitting $URL"
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET GitHub secret is empty; endpoint will 401."
          fi
          CURL_ARGS=(-sS --max-time 300
            -o /tmp/wells-martin.json
            -w 'HTTP %{http_code} in %{time_total}s\n')
          if [ -n "$CRON_SECRET" ]; then
            CURL_ARGS+=(-H "Authorization: Bearer $CRON_SECRET")
          fi
          HTTP_LINE=$(curl "${CURL_ARGS[@]}" "$URL")
          echo "$HTTP_LINE"
          STATUS=$(printf '%s' "$HTTP_LINE" | awk '{print $2}')
          if command -v jq >/dev/null; then
            jq '.' /tmp/wells-martin.json 2>/dev/null || cat /tmp/wells-martin.json
          else
            cat /tmp/wells-martin.json
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::Vercel wells scrape returned HTTP $STATUS for county=martin. If body says 'unauthorized', sync the CRON_SECRET GitHub secret with the Vercel CRON_SECRET env var."
            exit 1
          fi
