name: RRC wells daily (scrape)

# Daily wellbore metadata refresh at 21:00 UTC (= 4 PM CDT / 3 PM CST),
# one hour before the permits scrape so compute sees fresher operator /
# lease / status on <county>_wells.
#
# Same belt-and-suspenders pattern as rrc-permits-daily.yml:
#   1. Curl the Vercel /api/cron/scrape-wells endpoint (RRC allows
#      Vercel IPs; GitHub Actions runners are blocked).
#   2. The Vercel cron in vercel.json should also fire at 21:00 UTC.
#      Idempotent upsert on api_number — either path succeeding is enough.
#
# Scope: the active product counties with wells tables. One matrix job per
# county keeps each request well under the 300s cap (a single 7-county scrape
# can exceed it). Pass ?county=... to override for ad-hoc runs.

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

concurrency:
  group: rrc-wells-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        county: [howard, martin, midland, loving, reagan, upton, ward]
    steps:
      - uses: actions/checkout@v6

      - name: Scrape ${{ matrix.county }} wells
        env:
          VERCEL_CRON_URL: ${{ vars.VERCEL_CRON_WELLS_URL || 'https://mineral-map.vercel.app/api/cron/scrape-wells' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${VERCEL_CRON_URL}?county=${{ matrix.county }}"
          echo "Hitting $URL"
          HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            HEADER="-H \"Authorization: Bearer $CRON_SECRET\""
          fi
          eval curl -sS --fail --max-time 300 $HEADER \
            -o /tmp/wells-${{ matrix.county }}.json \
            -w '"\nHTTP %{http_code} in %{time_total}s\n"' \
            "$URL"
          if command -v jq >/dev/null; then
            jq '{ok, elapsedMs, totals, counties}' /tmp/wells-${{ matrix.county }}.json
          else
            cat /tmp/wells-${{ matrix.county }}.json
          fi

  # After the wells tables refresh, rebuild the map's well-geometry GeoJSON
  # (horizontal laterals + vertical/permit dots, colored by status/operator)
  # from the RRC well shapefiles + fresh status, and upload it to the public
  # `map-data` Storage bucket the map serves from. Best-effort: a failure here
  # can't affect the scrape, and the map falls back to the committed baseline.
  build-geojson:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas shapely pyshp httpx
      - name: Rebuild + upload well-geometry GeoJSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/build_wells_geojson.py \
            --county howard,martin,midland,loving,reagan,upton,ward --upload
