name: Lease memoranda weekly scrape

# County recorders update their indexes at wildly different cadences
# (Gonzales sub-daily; Loving maybe once a month). A weekly Sunday
# scrape catches new OGL / Memorandum-of-Lease filings across all 13
# counties with plenty of slack, without hammering the vendor
# portals. Ad-hoc manual runs via workflow_dispatch are also enabled.
#
# Runs 12:00 UTC every Sunday = 7:00 AM CDT / 6:00 AM CST.

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      counties:
        description: 'Comma-separated county ids to scrape (default: all 13)'
        required: false
        default: 'howard,martin,crane,glasscock,loving,midland,pecos,reagan,reeves,upton,ward,winkler'
      days:
        description: 'Lookback window in days'
        required: false
        default: '90'

concurrency:
  group: lease-memoranda-weekly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Scrape county recorders
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          COUNTIES="${{ github.event.inputs.counties || 'howard,martin,crane,glasscock,loving,midland,pecos,reagan,reeves,upton,ward,winkler' }}"
          DAYS="${{ github.event.inputs.days || '90' }}"
          python scripts/scrape_lease_memoranda.py \
            --county "$COUNTIES" \
            --days "$DAYS"
