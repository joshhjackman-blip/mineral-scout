name: Pad activity weekly (rig → completion)

# Weekly pad-activity detection across Permian counties.
#
# Phase 1 (default): RRC completion-transition bridge → writes
# pad_activity_events, bumps propensity_score, tags CRM deals hot.
#
# Phase 2: --enable-sentinel pulls before/after Sentinel-2 chips, scores
# change, classifies signatures, writes pad_change_log + pad_activity_events
# (with image paths). Scheduled runs enable Sentinel by default; the Pad
# Activity UI also shows an on-demand latest scene when paths are missing.

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      counties:
        description: 'Comma-separated county ids (default: howard,martin)'
        required: false
        default: 'howard,martin'
      lookback_days:
        description: 'RRC activity lookback window in days (approved/spud/completion)'
        required: false
        default: '90'
      dry_run:
        description: 'If true, skip DB writes'
        required: false
        default: 'false'
      enable_sentinel:
        description: 'If true, pull Sentinel-2 pad chips (Phase 2)'
        required: false
        default: 'true'
      max_chips:
        description: 'Max Sentinel chips per county when enable_sentinel=true'
        required: false
        default: '25'

concurrency:
  group: pad-activity-weekly
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/pad_activity/requirements.txt

      - name: Run pad-activity weekly
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AWS_NO_SIGN_REQUEST:       'YES'
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
        run: |
          COUNTIES="${{ github.event.inputs.counties || 'howard,martin' }}"
          DAYS="${{ github.event.inputs.lookback_days || '90' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          # Scheduled cron has no inputs — default Sentinel ON so before/after
          # paths land weekly. Manual runs can still set enable_sentinel=false.
          SENTINEL="${{ github.event.inputs.enable_sentinel || 'true' }}"
          MAX_CHIPS="${{ github.event.inputs.max_chips || '25' }}"
          EXTRA=""
          if [ "$DRY" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "$SENTINEL" = "true" ]; then
            EXTRA="$EXTRA --enable-sentinel --max-chips $MAX_CHIPS"
          fi
          python -m scripts.pad_activity.run_weekly \
            --county "$COUNTIES" \
            --lookback-days "$DAYS" \
            $EXTRA
