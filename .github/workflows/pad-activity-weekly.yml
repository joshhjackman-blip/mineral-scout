name: Pad activity weekly (rig → completion)

# Weekly pad-activity detection across Permian counties.
#
# Phase 1 (default): RRC completion-transition bridge → writes
# pad_activity_events, bumps propensity_score, tags CRM deals hot.
# Surfaces in OwnerDrawer "Well Activity" card.
#
# Phase 2 (opt-in later): add --enable-sentinel once rasterio chip
# crop is landed; Sentinel-2 does the cheap sift, paid high-res only
# for ambiguous high-propensity pads.
#
# Sunday 14:00 UTC = 9:00 AM CDT / 8:00 AM CST — after Saturday's
# lease-memoranda scrape has settled.

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      counties:
        description: 'Comma-separated county ids (default: howard,martin)'
        required: false
        default: 'howard,martin'
      lookback_days:
        description: 'RRC activity lookback window in days (approved/spud/completion)'
        required: false
        default: '90'
      dry_run:
        description: 'If true, skip DB writes'
        required: false
        default: 'false'

concurrency:
  group: pad-activity-weekly
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'supabase<2.15' numpy

      - name: Run pad-activity weekly
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          COUNTIES="${{ github.event.inputs.counties || 'howard,martin' }}"
          DAYS="${{ github.event.inputs.lookback_days || '90' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          EXTRA=""
          if [ "$DRY" = "true" ]; then EXTRA="--dry-run"; fi
          python -m scripts.pad_activity.run_weekly \
            --county "$COUNTIES" \
            --lookback-days "$DAYS" \
            $EXTRA
