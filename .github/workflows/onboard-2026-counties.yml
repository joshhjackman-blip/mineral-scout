name: Onboard 2026 Howard / Glasscock / Reeves / Pecos / Crane

# Pulls owner rolls + well zips from the private Raw-Data bucket (service
# role), loads the new county tables, rematches tracts, and uploads map
# GeoJSON to the public map-data bucket.
#
# Default mode is tables-only: rematch + map-data upload already landed.
# Dispatch with mode=full to rebuild GeoJSON.

on:
  workflow_dispatch:
    inputs:
      county:
        description: 'County id or "all"'
        required: false
        default: 'crane'
      mode:
        description: 'tables-only or full'
        required: false
        default: 'full'
  push:
    branches:
      - cursor/add-2026-howard-glasscock-reeves-pecos-634a
      - cursor/add-crane-county-634a
    paths:
      - '.github/workflows/onboard-2026-counties.yml'
      - 'scripts/onboard_2026_counties.py'
      - 'scripts/load_county_mineral_records.py'
      - 'scripts/load_county_wells_shapefile.py'
      - 'scripts/supabase_rest.py'

concurrency:
  group: onboard-2026-counties
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'supabase==2.14.0' pandas geopandas shapely pyogrio httpx pyshp

      - name: Onboard counties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            COUNTY="crane"
            MODE="full"
          else
            COUNTY="${{ github.event.inputs.county || 'crane' }}"
            MODE="${{ github.event.inputs.mode || 'full' }}"
          fi
          EXTRA=""
          if [ "$MODE" = "tables-only" ]; then
            EXTRA="--tables-only"
          fi
          echo "onboard county=$COUNTY mode=$MODE"
          python scripts/onboard_2026_counties.py --county "$COUNTY" $EXTRA
