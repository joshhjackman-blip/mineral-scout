name: RRC permits daily scrape

# Pulls the last ~30 days of drilling permits from the RRC public search
# for each active county and upserts them into <county>_permits so the
# tract sidebar's New Permits dropdown + the parcels production_status
# classifier reflect the latest RRC filings.
#
# Cron: 22:00 UTC daily = 5:00 PM CDT (America/Chicago summer) or
# 4:00 PM CST (winter). GitHub Actions cron doesn't support timezones,
# so we accept the ~1-hour drift twice a year rather than run two
# scheduled entries. Manual dispatch is enabled for ad-hoc catch-up.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      counties:
        description: 'Comma-separated county ids to scrape (default: all 12 counties on file)'
        required: false
        default: 'gonzales,howard,martin,crane,glasscock,loving,midland,pecos,reagan,reeves,upton,ward,winkler'
      days:
        description: 'Lookback window in days (max ~90)'
        required: false
        default: '30'
      wells_only:
        description: 'Skip the HTML fetch and use only the SYMNUM fallback'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: rrc-permits-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No pip cache: this repo has no requirements.txt / pyproject.toml
          # for setup-python to hash, and the install below is only two
          # small wheels — caching would save ~3s and add setup complexity.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requests + bs4 + lxml drive the real-time EWA HTML scraper.
          # geopandas + shapely are needed by compute_development_status.py
          # for the adjacency + point-in-polygon logic. pyshp remains for
          # the historical wells-zip SYMNUM fallback path.
          pip install supabase pyshp geopandas shapely requests beautifulsoup4 lxml

      - name: Scrape real-time permits from RRC EWA
        # Primary data path — hits the public RRC drilling-permit web
        # query and upserts fresh permits into <county>_permits on
        # api_number. This is what makes the sidebar "New Permits"
        # feed reflect filings from the last 24 hours; the historical
        # wells-zip / EWA CSV path below only refreshes when the RRC
        # publishes a new bulk snapshot (roughly monthly).
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          COUNTIES="${{ github.event.inputs.counties || 'gonzales,howard,martin,crane,glasscock,loving,midland,pecos,reagan,reeves,upton,ward,winkler' }}"
          # 90-day window catches anything the previous 30-day run
          # might have missed (holiday backlogs, RRC processing lags).
          python scripts/scrape_rrc_permits_realtime.py \
            --county "$COUNTIES" \
            --days 90

      - name: Refresh historical permits (wells-zip + EWA CSV)
        # Secondary data path — pulls the RRC wells shapefile (surface
        # locations, SYMNUM-driven permit identification) plus the
        # bulk EWA CSV. The EWA CSV in the Raw-Data bucket is
        # refreshed roughly monthly, so this pass mostly re-verifies
        # historical rows and fills in spud/completion dates on
        # older APIs. Non-fatal on failure so the real-time step
        # above already gave us fresh data.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: |
          COUNTIES="${{ github.event.inputs.counties || 'gonzales,howard,martin,crane,glasscock,loving,midland,pecos,reagan,reeves,upton,ward,winkler' }}"
          WELLS_ONLY_FLAG=""
          if [ "${{ github.event.inputs.wells_only }}" = "true" ]; then
            WELLS_ONLY_FLAG="--wells-only"
          fi
          python scripts/scrape_rrc_permits.py \
            --county "$COUNTIES" \
            --days 30 \
            $WELLS_ONLY_FLAG

      - name: Recompute tract_development_status
        # Ticket 1.3 Phase 1: after the daily scrape lands new W-1s,
        # reclassify every abstract into PDP / PUD_DUC / PUD_PERMITTED /
        # FRONTIER and refresh pud_score. Only runs for counties whose
        # Abstracts.shp is currently reachable (Gonzales / Howard /
        # Martin); the 10 new Permian counties are skipped with a
        # NOTICE until their abstract shapefile lands in the bucket.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/compute_development_status.py \
            --county gonzales,howard,martin
