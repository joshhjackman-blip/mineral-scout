name: RRC permits daily (compute pass only)

# The RRC EWA scrape that used to live here moved to a Vercel Cron
# endpoint on 2026-07-21 (see app/api/cron/scrape-permits/route.ts
# + vercel.json). Root cause: RRC's public EWA server blocks
# GitHub Actions IP ranges, and 8 rounds of ScrapingBee proxy
# tuning all failed at the TLS handshake layer. Vercel's
# serverless IPs aren't on RRC's block-list, so scraping from
# there works directly with zero proxy cost.
#
# This workflow now only runs compute_development_status.py —
# which reads Supabase and doesn't need to talk to RRC. Timing
# nudged 30 minutes past the Vercel Cron (22:00 UTC) so we
# reclassify against the freshest permit data:
#
#   22:00 UTC   Vercel Cron scrapes RRC -> upserts permits table
#   22:30 UTC   This workflow recomputes tract_development_status
#
# Manual dispatch still supported for ad-hoc reruns.

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: rrc-permits-daily
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # compute_development_status.py needs geopandas + shapely
        # for the adjacency + point-in-polygon logic. supabase-py
        # for DB writes. pyshp so the wells-zip lateral loader can
        # feed the infill-gap detection. No requests / bs4 /
        # scrapingbee any more — the RRC scrape moved to Vercel
        # Cron.
        run: |
          python -m pip install --upgrade pip
          pip install supabase pyshp geopandas shapely

      - name: Recompute tract_development_status
        # Reclassifies every abstract into PDP / PUD_DUC /
        # TRUE_PUD / PUD_PERMITTED / PUD_INFILL / LEASING_ACTIVE /
        # FRONTIER after the fresh permits landed via Vercel Cron
        # 30 minutes ago.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/compute_development_status.py \
            --county howard,martin
