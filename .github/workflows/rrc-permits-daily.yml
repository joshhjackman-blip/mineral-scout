name: RRC permits daily (scrape + compute)

# Daily pipeline in two steps at 22:00 UTC (= 5 PM CDT / 4 PM CST):
#
#   1. Fire the Vercel /api/cron/scrape-permits endpoint via curl.
#      That endpoint runs the RRC EWA HTML scraper from Vercel's
#      serverless infrastructure — which isn't on RRC's IP block-
#      list (unlike GitHub Actions runners) — and upserts fresh
#      permits into every county's _permits table.
#
#   2. Run compute_development_status.py to reclassify every
#      abstract into PDP / PUD_DUC / TRUE_PUD / PUD_PERMITTED /
#      PUD_INFILL / LEASING_ACTIVE / FRONTIER using the freshly-
#      landed permit rows. This step reads exclusively from
#      Supabase, so RRC's block doesn't matter here.
#
# Belt-and-suspenders architecture: Vercel Cron *should* also
# fire the same scrape endpoint at 22:00 UTC (per vercel.json).
# When both fire, the second one just re-updates the same rows
# (idempotent upsert on api_number). So either path succeeding
# is enough to keep the pipeline alive. If a user is on Vercel
# Hobby (where crons are limited) or Vercel drops their cron
# registration, this GH workflow is the backup.

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: rrc-permits-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # checkout@v6 / setup-python@v6 ship on the Node 24 Actions
      # runtime. v4/v5 still declare Node 20 and emit the
      # "Node.js 20 is deprecated … forced to run on Node.js 24"
      # warning on every run (GitHub forced the runtime switch
      # 2026-06-16; Node 20 removed 2026-09-16).
      - uses: actions/checkout@v6

      - name: Trigger Vercel RRC scrape
        # 5 min timeout because a fresh 12-county scrape takes ~40s
        # end-to-end but RRC's form-slow-first-load can add
        # another minute or two. --fail so non-2xx short-circuits
        # the step with a real error message. --max-time bounds
        # the whole thing so a Vercel outage doesn't hang the
        # workflow.
        # If VERCEL_CRON_URL isn't set, defaults to the main
        # production URL. CRON_SECRET is optional — if the
        # endpoint's auth is enabled we pass the Bearer header
        # so the curl matches Vercel Cron's own auth pattern.
        env:
          VERCEL_CRON_URL: ${{ vars.VERCEL_CRON_URL || 'https://mineral-map.vercel.app/api/cron/scrape-permits' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Hitting $VERCEL_CRON_URL"
          HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            HEADER="-H \"Authorization: Bearer $CRON_SECRET\""
          fi
          # -sS: silent but show errors. -o writes JSON to stdout
          # via /dev/stdout so the ingest report shows in the log.
          # -w emits the HTTP code + timing on a trailing line.
          eval curl -sS --fail --max-time 300 $HEADER \
            -o /tmp/scrape-response.json \
            -w '"\nHTTP %{http_code} in %{time_total}s\n"' \
            "$VERCEL_CRON_URL"
          echo "--- ingest report ---"
          # jq if available, else raw JSON
          if command -v jq >/dev/null; then
            jq '{ok, totals, elapsedMs, counties: (.counties | map({county, parsed, inserted, updated}))}' /tmp/scrape-response.json
          else
            cat /tmp/scrape-response.json
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # compute_development_status.py needs geopandas + shapely
        # for the adjacency + point-in-polygon logic. supabase-py
        # for DB writes. pyshp so the wells-zip lateral loader can
        # feed the infill-gap detection.
        #
        # supabase-py pinned to <2.15 as of 2026-07-22. The 2.31
        # release generates request URLs Supabase's edge-routing
        # layer rejects with PGRST125 'Invalid path specified in
        # request URL'. Same error was blocking scrape_rrc_permits.py
        # earlier this week. 2.14.x has been stable for us across
        # multiple prior compute runs.
        run: |
          python -m pip install --upgrade pip
          pip install 'supabase<2.15' pyshp geopandas shapely

      - name: Recompute tract_development_status
        # Reclassifies every abstract now that fresh permits landed
        # ~30 seconds ago from the Vercel scrape step. If the scrape
        # step failed, this still runs against whatever data is in
        # Supabase — better to have a stale compute than no compute.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/compute_development_status.py \
            --county howard,martin,midland,loving,reagan,upton,ward
